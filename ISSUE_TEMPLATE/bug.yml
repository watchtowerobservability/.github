name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@watchtowerobservability/node 0.1.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and framework versions
      placeholder: "Node 22, Express 4.19"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code. Never paste keys or tokens.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      render: text
